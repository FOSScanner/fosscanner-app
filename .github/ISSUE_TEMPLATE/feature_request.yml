name: Feature request
description: Suggest an idea for FOSScanner
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: >-
        FOSScanner makes no network calls of its own. On native platforms it
        keeps an unfinished draft in the app's private, OS-managed cache; web
        drafts are memory-only (see the README). Please confirm your suggestion
        preserves these privacy boundaries.
      options:
        - label: This doesn't require network calls or storage outside the app-private cache
          required: true

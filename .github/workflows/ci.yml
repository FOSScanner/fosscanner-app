name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          retention-days: 14

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # The release workflow signs with secrets this workflow cannot read, so the
  # ANDROID_KEYSTORE_PASSWORD override in android/app/build.gradle.kts is
  # exercised here against a throwaway keystore instead.
  android-signing:
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Both corruptions the override exists for: a key.properties round trip
      # strips the leading whitespace of this value and consumes the backslash
      # as an escape. Signing only succeeds if the password reaches Gradle
      # verbatim, and the step below asserts the round trip really does differ.
      ANDROID_KEYSTORE_PASSWORD: '  safe\:pass:word=1  '
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'

      - name: Create a throwaway release keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/app/upload-keystore.jks \
            -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=FOSScanner CI Signing Check, O=FOSScanner, C=AU' \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEYSTORE_PASSWORD"
          # Mirror release.yml: key.properties carries no password fields.
          cat > android/key.properties <<'EOF'
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Confirm key.properties parsing would corrupt this password
        run: |
          printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/mangled.properties"
          cat > "$RUNNER_TEMP/PropertiesFidelity.java" <<'EOF'
          import java.io.FileInputStream;
          import java.util.Properties;

          public class PropertiesFidelity {
              public static void main(String[] args) throws Exception {
                  Properties properties = new Properties();
                  try (FileInputStream stream = new FileInputStream(args[0])) {
                      properties.load(stream);
                  }
                  String parsed = properties.getProperty("storePassword");
                  String raw = System.getenv("ANDROID_KEYSTORE_PASSWORD");
                  System.out.printf("raw=[%s] parsed=[%s]%n", raw, parsed);
                  if (raw.equals(parsed)) {
                      throw new AssertionError(
                          "this password survives .properties parsing, so the build no "
                              + "longer covers the corruption the override exists for");
                  }
              }
          }
          EOF
          java "$RUNNER_TEMP/PropertiesFidelity.java" "$RUNNER_TEMP/mangled.properties"

      - name: Build a release APK signed through the environment override
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify the APK carries the throwaway signing certificate
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(find "$sdk/build-tools" -name apksigner | sort -V | tail -1)
          test -n "$apksigner" || { echo "apksigner not found under $sdk" >&2; exit 1; }
          "$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -q 'CN=FOSScanner CI Signing Check'

  ios:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
      - run: flutter build ios --no-codesign
